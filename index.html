<!DOCTYPE html>
<html lang="mk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101820">
<title>Автобус Скопје</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-row">
    <h1 class="brand">Автобус</h1>
    <div class="topbar-right">
      <div class="status" id="status"><span id="status-state" aria-live="polite"></span><span id="status-age" aria-hidden="true"></span></div>
      <button class="icon-btn settings-btn" id="btn-settings" type="button" aria-label="Поставки" aria-pressed="false"></button>
    </div>
  </div>
  <div class="banner" id="banner" hidden></div>
</header>

<main id="view">
  <section id="panel-stop">
    <div class="stop-head" id="stop-head"></div>
    <ul class="arrivals" id="arrivals"></ul>
    <p class="empty" id="empty" hidden></p>
  </section>

  <section id="panel-pick" hidden>
    <div class="pick-wrap">
      <input class="search" id="pick-search" type="search" autocomplete="off"
             placeholder="Име или број на постојка" aria-label="Пребарај постојка">
      <div class="stop-actions">
        <button class="btn" id="pick-nearest" type="button">Најблиска до мене</button>
      </div>
    </div>
    <div id="pick-results"></div>
  </section>

  <section id="panel-info" hidden>
    <div class="info" id="info-body"></div>
  </section>
</main>

<!-- Full-screen: one bus, shown only while a row is tapped. Not part of the
     tab system - js/ui-detail.js shows/hides it directly. -->
<section id="panel-detail" hidden></section>

<nav class="tabbar">
  <button class="tab" id="tab-stop" type="button" aria-pressed="true">Постојка</button>
  <button class="tab" id="tab-pick" type="button" aria-pressed="false">Најди постојка</button>
</nav>

<div id="toast" role="status"></div>

<!-- Script order is the dependency graph. sw.js ASSETS must mirror this list. -->
<script src="js/dom.js"></script>
<script src="js/api.js"></script>
<script src="js/cache.js"></script>
<script src="js/store.js"></script>
<script src="js/history.js"></script>
<script src="js/eta.js"></script>
<script src="js/debug.js"></script>
<script src="js/timetable.js"></script>
<script src="js/ui-stop.js"></script>
<script src="js/ui-detail.js"></script>
<script src="js/ui-pick.js"></script>
<script src="js/ui-info.js"></script>
<script src="js/app.js"></script>
</body>
</html>
